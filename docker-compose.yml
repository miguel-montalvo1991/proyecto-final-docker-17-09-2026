services:

  # ---------------------------------------------------------------------
  # Servicio de base de datos PostgreSQL
  # ---------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: proyecto3_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Volumen persistente de datos de Postgres
      - pg_data:/var/lib/postgresql/data
      # Los .sql en esta carpeta se ejecutan automáticamente SOLO la primera vez
      # que se crea el volumen (cuando el directorio de datos está vacío)
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------
  # Servicio de la API (imagen propia, construida con build)
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyecto3_api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db          # nombre del servicio, NO localhost: Docker resuelve nombres en su red interna
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy   # la API espera a que Postgres esté "healthy", no solo "iniciado"

  # ---------------------------------------------------------------------
  # Servicio de pgAdmin (administración visual de la base de datos)
  # ---------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: proyecto3_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
